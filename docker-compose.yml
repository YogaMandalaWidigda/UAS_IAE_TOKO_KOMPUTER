version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: order_service_app
    container_name: order_service_app
    ports:
      - "9000:9000"
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file:
      - .env
    networks:
      - laravel
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:81"
    volumes:
      - .:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: order_service_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_laravel_order
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_laravel_order.sql:/docker-entrypoint-initdb.d/db_laravel_order.sql
    ports:
    - "3308:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data: