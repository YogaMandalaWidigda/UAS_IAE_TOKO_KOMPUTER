"A datetime string with format Y-m-d H:i:s, e.g. 2018-05-23 13:43:32."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
  "Find a single customer by an identifying attribute."
  customer(
    "Search by primary key."
    customer_id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

    "Search by email address."
    email: String @eq @rules(apply: ["prohibits:customer_id", "required_without:customer_id", "email"])
  ): Customer @find

  "List multiple customers."
  customers(
    "Filters by customer name. Accepts SQL LIKE wildcards % and _."
    customer_name: String @where(operator: "like")
  ): [Customer!]! @paginate(defaultCount: 10)
}

"Defines operations that modify customer data."
type Mutation {
  "Create a new customer tanpa password."
  createCustomer(
    customer_name: String! @rules(apply: ["required"])
    email: String! @rules(apply: ["required", "email", "unique:customers,email"])
    address: String! @rules(apply: ["required"])
    phone_number: String! @rules(apply: ["required"])
  ): Customer @create

  "Update customer data by ID."
  updateCustomer(
    customer_id: ID! @where
    customer_name: String
    email: String
    address: String
    phone_number: String
  ): Customer @update

  "Delete customer by ID."
  deleteCustomer(
    customer_id: ID! @where
  ): Customer @delete
}

"Customer account type."
type Customer {
  customer_id: ID!
  customer_name: String!
  email: String!
  address: String!
  phone_number: String!
  email_verified_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
}
